name: HACS

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so an upstream HACS rule change is caught even with no commits.
    - cron: "23 5 * * *"
  workflow_dispatch:

# Least privilege: both the gate and the scheduled compatibility canary only
# read the checkout and report a result. The gate pins the action's wrapper by
# SHA, but that wrapper runs the ghcr.io/hacs/action:main image, so both jobs
# run whatever that image tag holds on the day; the canary follows the newest
# wrapper as well.
permissions:
  contents: read

jobs:
  validate:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The jobs only read the checkout; keep the job token out of .git/config.
          persist-credentials: false
      - name: HACS Action
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: false

  compatibility-canary:
    name: HACS current-rules canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The jobs only read the checkout; keep the job token out of .git/config.
          persist-credentials: false
      - name: HACS Action current rules
        # This isolated scheduled job intentionally follows upstream so a new
        # HACS submission rule is visible without making a mutable ref a merge gate.
        uses: hacs/action@main
        with:
          category: integration
          comment: false
