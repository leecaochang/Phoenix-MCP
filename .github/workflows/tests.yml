name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the checkout and reports results.
permissions:
  contents: read

jobs:
  ha-floor:
    name: Home Assistant 2026.7 runtime compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the matched floor test stack
        run: python -m pip install "pytest-homeassistant-custom-component==0.13.344"
      - name: Install integration and component requirements with HA constraints
        run: python tests/ha_floor_dependencies.py
      - name: Import first-party modules and exercise runtime boundaries
        run: |
          python - <<'PY'
          import importlib
          import pkgutil
          import custom_components.phoenix_mcp as package

          prefix = f"{package.__name__}."
          names = sorted(module.name for module in pkgutil.walk_packages(package.__path__, prefix)
                         if ".mesa_core" not in module.name)
          for name in names:
              importlib.import_module(name)
          print(f"Imported {len(names)} Phoenix modules on Home Assistant 2026.7.0")
          PY
          python -m pytest -q tests/test_security_boundaries.py tests/test_http_authorization.py tests/test_config_flow.py tests/test_ha_version_floor.py

  pytest:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches the pinned test stack in requirements_test.txt
          # (pytest-homeassistant-custom-component -> homeassistant 2026.9.4).
          python-version: "3.14"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Lint (pyflakes)
        # Every target must be TRACKED: pyflakes exits 1 on a missing path, so
        # linting an ignored directory passes locally and fails on a clean
        # checkout. scripts/ holds the vendoring and release tooling.
        run: python -m pyflakes custom_components/phoenix_mcp tests scripts
      - name: Typecheck (mypy)
        # Config, including the per-module ratchet, lives in pyproject.toml so the
        # local run and CI agree. Non-strict on purpose: this exists to catch HA
        # drift (a renamed attribute, a wrong argument) now that `hass` is typed
        # as HomeAssistant rather than Any, not to enforce full annotations.
        run: python -m mypy
      - name: Run pytest with coverage
        # fail_under lives in pyproject.toml so the local run and CI agree.
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Sourced from .nvmrc so CI, local dev, and the lockfile stay on one
          # Node major. It must match the npm that generated package-lock.json
          # (npm 11 / Node 24); an older npm resolves the tree differently and
          # makes `npm ci` reject the lockfile as out of sync.
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Run vitest
        run: npm run test
      - name: Audit shipped dependencies
        # Production tree only: the dev toolchain is not installed alongside the
        # integration, so a dev-only advisory must not fail a release check.
        run: npm audit --omit=dev
      - name: Production build
        # The panel is shipped as a committed bundle, so a build that only
        # breaks in production would otherwise go unnoticed until deploy.
        run: npm run build
      - name: Committed bundles are current
        # The build overwrites the committed bundles and succeeds either way,
        # so building alone proves nothing about what is shipped. This fails if
        # frontend_src changed without the rebuilt bundles being committed.
        run: |
          git diff --exit-code -- custom_components/phoenix_mcp/frontend
          test -z "$(git ls-files --others --exclude-standard -- custom_components/phoenix_mcp/frontend)"
