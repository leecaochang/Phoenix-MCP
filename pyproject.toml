[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Home Assistant installs its httpx alias before respx is imported.
addopts = "-p no:respx --strict-markers --strict-config"
# Per test, fixtures included. A hang fails with every thread's stack instead of
# holding the job until its limit. Far above the slowest test, so load cannot reach it.
timeout = 120

[tool.coverage.run]
source = ["custom_components/phoenix_mcp"]
branch = true
# Instrument disposable workers without changing their runtime or OS limits.
patch = ["subprocess"]
# mesa_core is a vendored copy of a separate, read-only project. Its coverage
# is not ours to move, and including it drags the measured total below what our
# own tests actually cover, which would make the CI threshold meaningless.
omit = ["custom_components/phoenix_mcp/mesa_core/*"]

[tool.coverage.report]
# Minimum first-party coverage gate over statements and branches together. This
# is a floor, not a claim that every covered branch is qualified. Killed workers
# cannot flush coverage data. Keep it just below the measured figure and never
# lower it to pass; subprocess instrumentation also runs in Linux CI.
fail_under = 88

[tool.phoenix-coverage-floors]
# Per-module floors over statements and branches, checked in CI by
# scripts/check_coverage_floors.py from coverage.py's JSON report. These modules
# hold the authority, approval and restore decisions, so a drop in one must not
# be averaged away. Keep each just below its measured figure and never lower one
# to pass.
"access_key_store.py" = 94
"approvals.py" = 96
"helpers.py" = 89
"mesa.py" = 93
"policy_engine.py" = 94
"request_authority.py" = 99
"tools/recovery.py" = 70

[tool.mypy]
# Phoenix MCP's coupling to HA internals is its top maintenance risk. A function
# whose `hass` parameter is annotated HomeAssistant is checked against HA's own
# types; one still annotated Any is not. This runs NON-STRICT on purpose: the goal
# is to catch real drift (a renamed HA attribute, a wrong argument) rather than to
# chase full annotation coverage.
# Keep this aligned with the HA test interpreter: mypy applies python_version
# when parsing dependencies too, and Home Assistant itself uses syntax far newer
# than that floor (unparenthesized except groups in hundreds of files, plus type
# parameter defaults), which stops the run before it checks anything. It therefore
# follows the interpreter. Phoenix's own floor is enforced per-file by an AST parse
# at that feature version, which is the only check that sees our source alone.
files = ["custom_components/phoenix_mcp"]
# HA and its dependency tree ship incomplete stubs; without this every import
# would be an error and the real findings would be buried.
ignore_missing_imports = true
# mesa_core is a vendored copy of a separate, read-only project (same reasoning
# as the coverage omit above). It also resolves under two module names, which
# stops mypy before it checks anything of ours.
exclude = "custom_components/phoenix_mcp/mesa_core/"
explicit_package_bases = true
mypy_path = "."
# Deliberately off: demanding annotated defs everywhere would bury the useful
# findings. The bodies of unannotated defs are still checked.
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true

# Do not add a per-module ignore_errors; fix the finding.

# Vendored read-only copy of a separate project (the coverage omit and the
# exclude above say the same thing); it is reachable by import even when
# excluded from discovery.
[[tool.mypy.overrides]]
module = ["custom_components.phoenix_mcp.mesa_core.*"]
ignore_errors = true
